# SearXNG 配置（覆盖式，未写的项使用默认值）
# 参考: https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

general:
  instance_name: "My SearXNG"
  debug: false
  privacypolicy_url: false
  donation_url: false
  contact_url: false

search:
  # 必须包含 json，MCP 才能拿结构化结果
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

server:
  secret_key: "change-me-to-a-random-secret"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "POST"

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0

# 引擎开关与权重（Docker 覆盖式配置），与原生 searxng-local-settings.yml 的策略保持一致
engines:
  - name: google
    disabled: false
    weight: 1.5
  - name: bing
    disabled: false
    weight: 1.4
  - name: duckduckgo
    disabled: false
    weight: 1.2
  - name: brave
    disabled: false
    weight: 1.4
  - name: mojeek
    disabled: false
    weight: 1.0
  - name: startpage
    disabled: false
    weight: 1.3
  - name: qwant
    disabled: false
    weight: 1.1
  - name: wikipedia
    disabled: false
    weight: 1.2
  - name: wikidata
    disabled: false
  - name: crossref
    disabled: false
    weight: 1.0
