# SearXNG 配置（覆盖式，未写的项使用默认值）
# 参考: https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

general:
  instance_name: "My SearXNG"
  debug: false
  privacypolicy_url: false
  donation_url: false
  contact_url: false

search:
  # 必须包含 json，MCP 才能拿结构化结果
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

server:
  secret_key: "change-me-to-a-random-secret"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "POST"

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0

# 只调对抓取友好的引擎；Google/Bing 反爬强，默认禁用
engines:
  - name: google
    disabled: true
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: qwant
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
