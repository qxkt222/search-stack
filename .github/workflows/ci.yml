name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 代码没变也每天跑一次，抓上游依赖/环境漂移——push CI 抓不到这类问题。
  # UTC 20:00 = 北京次日 04:00。
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # 测试全部走 httpx.MockTransport，不依赖真实 SearXNG 实例
      - run: uv sync --all-groups
      - run: uv run pytest -q
