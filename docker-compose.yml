# ============================================================
# search-stack - Docker deployment (SearXNG only)
#
# Usage:
#   PowerShell:  $env:SEARXNG_SECRET = "<random-string>"; docker compose up -d
#   bash:        export SEARXNG_SECRET="$(openssl rand -hex 32)"; docker compose up -d
#
# The search MCP server runs on the HOST in stdio mode and connects to
# http://localhost:8888. An optional MCP container is kept commented out
# below: it requires a Dockerfile in ./mcp-server and has NOT been tested.
# ============================================================

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      # Override server.secret_key from searxng-settings.yml.
      # Always set SEARXNG_SECRET in your shell or a local .env file;
      # the default below is a placeholder, not a real secret.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-to-a-random-secret}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      # Prefer busybox wget; fall back to the image's Python interpreter.
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://localhost:8080/healthz || python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).status == 200 else 1)\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

